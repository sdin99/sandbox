name: Build Oracle Database Image

on:
  push:
    branches: [main]
    paths:
      - 'oracle-db/dockerfiles/**'
      - '.github/workflows/oracle-build.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/oracle-db

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download Oracle XE RPM
        run: |
          cd oracle-db/dockerfiles/21.3.0
          wget --no-check-certificate --no-cookies --header "Cookie: oraclelicense=accept-securebackup-cookie" \
          https://download.oracle.com/otn-pub/otn_software/db-express/oracle-database-xe-21c-1.0-1.ol7.x86_64.rpm

      - name: Build Oracle Image using script
        run: |
          cd oracle-db/dockerfiles
          chmod +x buildContainerImage.sh
          ./buildContainerImage.sh -v 21.3.0 -x

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY_GHCR }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=21.3.0-xe
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Push Image to Registries
        run: |
          TAGS_JSON='${{ steps.meta.outputs.json }}'
          for tag in $(echo $TAGS_JSON | jq -r '.tags[]'); do
            docker tag oracle/database:21.3.0-xe $tag
            docker push $tag
          done