apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: sandbox
  labels:
    app: ollama
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
      - name: ollama
        image: ghcr.io/sdin99/sandbox-ollama:latest
        resources:
          requests:
            nvidia.com/gpu: 1
            memory: "36Gi"
            cpu: "2"
          limits:
            nvidia.com/gpu: 1
            memory: "36Gi"
            cpu: "4"
        ports:
        - containerPort: 11434
          name: api
        volumeMounts:
        - name: ollama-storage
          mountPath: /root/.ollama
      volumes:
      - name: ollama-storage
        persistentVolumeClaim:
          claimName: ollama-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: sandbox
spec:
  ports:
  - port: 11434
    targetPort: 11434
  selector:
    app: ollama